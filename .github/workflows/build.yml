name: Validate website
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: python -m py_compile tools/catalog_new_photos.py tools/process_and_publish.py tools/classify_publication.py tools/publish_catalog.py
